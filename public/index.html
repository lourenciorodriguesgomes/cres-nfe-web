<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRES NFe - Sistema de Gestao</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>CRES NFe</h2>
        <span class="version">Web 1.0</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="bancos"><span class="nav-icon">🏦</span><span class="nav-label">Bancos</span></a>
        <a href="#" class="nav-item" data-page="estoque"><span class="nav-icon">📦</span><span class="nav-label">Estoque</span></a>
        <a href="#" class="nav-item" data-page="funcionarios"><span class="nav-icon">👥</span><span class="nav-label">Funcionarios</span></a>
        <a href="#" class="nav-item" data-page="cadastros"><span class="nav-icon">📋</span><span class="nav-label">Cadastros</span></a>
        <a href="#" class="nav-item" data-page="movimentos"><span class="nav-icon">🔄</span><span class="nav-label">Movimentos</span></a>
        <a href="#" class="nav-item" data-page="nfe"><span class="nav-icon">🧾</span><span class="nav-label">NF-e</span></a>
        <a href="#" class="nav-item" data-page="crm"><span class="nav-icon">🤝</span><span class="nav-label">CRM</span></a>
        <a href="#" class="nav-item" data-page="sintegra"><span class="nav-icon">📊</span><span class="nav-label">Sintegra</span></a>
        <a href="#" class="nav-item" data-page="fluxocaixa"><span class="nav-icon">💰</span><span class="nav-label">Fluxo de Caixa</span></a>
        <a href="#" class="nav-item" data-page="caixa"><span class="nav-icon">💵</span><span class="nav-label">Caixa</span></a>
        <a href="#" class="nav-item" data-page="repasse"><span class="nav-icon">📤</span><span class="nav-label">Repasse</span></a>
        <a href="#" class="nav-item" data-page="configura"><span class="nav-icon">⚙️</span><span class="nav-label">Configura</span></a>
        <a href="#" class="nav-item" data-page="utilitarios"><span class="nav-icon">🛠️</span><span class="nav-label">Utilitarios</span></a>
        <a href="#" class="nav-item" data-page="backup"><span class="nav-icon">💾</span><span class="nav-label">Backup</span></a>
        <a href="#" class="nav-item" data-page="suporte"><span class="nav-icon">🎧</span><span class="nav-label">Suporte</span></a>
      </nav>
      <div class="sidebar-footer">
        <span class="db-status" id="dbStatus">● Conectando...</span>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <button class="btn-toggle" onclick="toggleSidebar()">☰</button>
        <h1 id="pageTitle">Bancos</h1>
        <div class="topbar-right">
          <span id="operadorInfo">Operador: 1</span>
          <button class="btn-sair" onclick="sair()">Sair</button>
        </div>
      </header>
      <div class="page-content" id="pageContent"></div>
    </main>
  </div>
  <div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modalTitle"></h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
